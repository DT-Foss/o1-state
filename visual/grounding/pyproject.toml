[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fertig-grounding-kernel"
version = "0.1.0"
description = "Sealed deterministic reference implementation for operational symbol grounding"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
grounding-kernel = "grounding_kernel.benchmark:main"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["grounding_kernel*"]
