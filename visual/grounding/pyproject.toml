[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fertig-grounding-kernel"
version = "0.2.0"
description = "Falsifiable operational symbol-grounding reference kernels and sealed protocols"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
grounding-kernel = "grounding_kernel.benchmark:main"
grounding-kernel-v1 = "grounding_kernel.v1_benchmark:main"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["grounding_kernel*", "grounding_reference_candidate*"]
